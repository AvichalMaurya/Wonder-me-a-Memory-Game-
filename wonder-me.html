<! DOCTYPE html>
<html>
<head>
<style>
@import url('https://fonts.googleapis.com/css2?family=Passion+One:wght@400;700;900&display=swap');
</style>
<link rel="stylesheet" href="wonder-me.css">
<title>Wonder me</title>
</head>
<body>
    <div id="wonder-me-container">
        <p class="wonder-me-head"> Wonder me </p>
        <div class="remember-container">
            <div class="remember-title">Remember what you see on the screen.</div>
            <div class="remember-obj-container">
                <div class="remember-obj" id="remember-obj-1"></div>
                <div class="remember-obj" id="remember-obj-2"></div>
                <div class="remember-obj" id="remember-obj-3"></div>
                <div class="remember-obj" id="remember-obj-4"></div>
                <div class="remember-obj" id="remember-obj-5"></div>
                <div class="remember-obj" id="remember-obj-6"></div>
                <div class="remember-obj" id="remember-obj-7"></div>
                <div class="remember-obj" id="remember-obj-8"></div>
                <div class="remember-obj" id="remember-obj-9"></div>
            </div>
            <button class="play-btn" onclick="startGame()"> Play </button>
        </div>
    </div>
    <div class="score-board">Lives:3</div>
    <script src="wonder-me.js"></script>
</body>
</html>
